<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Painel de Gestão — HD Distribuidora RH</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F0F3F8; --surface: #FFFFFF; --border: #C8D6E8;
      --text: #1C201A; --text-muted: #5E6659; --text-hint: #9AA394;
      --accent: #2E4DA6; --accent-light: #E8EDF8; --accent-text: #1A2D6B;
      --radius: 12px; --radius-sm: 8px;
      --verde: #1e6b3a; --verde-bg: #d4edda;
      --amarelo: #856404; --amarelo-bg: #fff3cd;
      --vermelho: #8b1a27; --vermelho-bg: #f8d7da;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* LOGIN */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 36px; width: 100%; max-width: 380px; }
    .login-card h1 { font-family: 'Lora', serif; font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--text-hint); margin-bottom: 28px; }
    .login-field { margin-bottom: 16px; }
    .login-field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
    .login-field input { width: 100%; padding: 10px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color .15s; }
    .login-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(46,77,166,0.1); }
    .btn-login { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: background .15s; }
    .btn-login:hover { background: #1A2D6B; }
    .login-erro { font-size: 12px; color: #c0392b; margin-top: 10px; display: none; text-align: center; }

    /* HEADER */
    header { background: var(--accent); color: #fff; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header-back { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 13px; transition: color .2s; }
    .header-back:hover { color: #fff; }
    .header-title { font-family: 'Lora', serif; font-size: 18px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-user { font-size: 12px; color: rgba(255,255,255,0.7); }
    .btn-sair { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: background .15s; }
    .btn-sair:hover { background: rgba(255,255,255,0.25); }

    /* PAINEL */
    .painel { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }

    .topo-filtros { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
    .filtro-ano { display: flex; align-items: center; gap: 8px; }
    .filtro-ano label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .filtro-ano select { padding: 8px 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: white; outline: none; }
    .quadro-info { font-size: 13px; color: var(--text-hint); }
    .quadro-info b { color: var(--text); }

    .alerta { background: var(--amarelo-bg); border: 1px solid #ecd48a; border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; color: var(--amarelo); margin-bottom: 20px; display: none; line-height: 1.5; }
    .alerta.show { display: block; }
    .alerta a { color: inherit; font-weight: 700; text-decoration: underline; }

    .secao-titulo { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-hint); margin: 28px 0 12px; }
    .secao-titulo:first-of-type { margin-top: 0; }

    .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }

    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
    .stat-label { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stat-value { font-family: 'Lora', serif; font-size: 32px; font-weight: 600; color: var(--accent-text); line-height: 1; }
    .stat-value.sem-dado { color: var(--text-hint); font-size: 22px; }
    .stat-sub { font-size: 12px; color: var(--text-hint); margin-top: 6px; line-height: 1.5; }
    .stat-extra { font-size: 12px; color: var(--text-muted); margin-top: 10px; padding-top: 10px; border-top: 1px solid #eef1f6; }
    .badge-zona { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: .03em; }
    .badge-critica { background: var(--vermelho-bg); color: var(--vermelho); }
    .badge-positiva { background: var(--amarelo-bg); color: var(--amarelo); }
    .badge-excelente { background: var(--verde-bg); color: var(--verde); }

    .card-dupla { display: flex; flex-direction: column; gap: 10px; }
    .dupla-item { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .dupla-item .dupla-label { font-size: 12px; color: var(--text-muted); flex: 1; }
    .dupla-item .dupla-valor { font-family: 'Lora', serif; font-size: 22px; font-weight: 600; color: var(--accent-text); white-space: nowrap; }

    .card-construcao { background: var(--surface); border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--text-hint); }
    .card-construcao .icone { font-size: 24px; margin-bottom: 8px; }
    .card-construcao .titulo { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }
    .card-construcao .desc { font-size: 12px; line-height: 1.5; }

    .enps-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .enps-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .enps-score { font-family: 'Lora', serif; font-size: 40px; font-weight: 600; color: var(--accent-text); line-height: 1; }
    .enps-total { font-size: 12px; color: var(--text-hint); margin-top: 4px; }
    .enps-breakdown { display: flex; gap: 18px; flex-wrap: wrap; }
    .enps-item { text-align: center; }
    .enps-item .n { font-family: 'Lora', serif; font-size: 20px; font-weight: 600; }
    .enps-item .l { font-size: 11px; color: var(--text-hint); text-transform: uppercase; letter-spacing: .04em; }
    .enps-item.promotor .n { color: var(--verde); }
    .enps-item.neutro .n { color: var(--amarelo); }
    .enps-item.detrator .n { color: var(--vermelho); }
    .enps-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 9px 16px; background: var(--accent-light); color: var(--accent-text); border-radius: var(--radius-sm); font-size: 12px; font-weight: 600; text-decoration: none; }
    .enps-link:hover { background: #d8e2f5; }

    .loading { text-align: center; padding: 48px 20px; color: var(--text-hint); font-size: 14px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <h1>🔒 Painel de Gestão</h1>
    <p>Indicadores de RH — acesso restrito ao RH e liderança autorizada.</p>
    <div class="login-field">
      <label>Usuário</label>
      <input type="text" id="login-user" placeholder="usuário" onkeydown="if(event.key==='Enter')fazerLogin()"/>
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="senha" onkeydown="if(event.key==='Enter')fazerLogin()"/>
    </div>
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="login-erro" id="login-erro">Usuário ou senha incorretos.</div>
  </div>
</div>

<!-- PAINEL -->
<div id="painel-wrap" style="display:none;">
  <header>
    <div class="header-left">
      <a class="header-back" href="../">← Portal RH</a>
      <span class="header-title">Painel de Gestão</span>
    </div>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="painel">
    <div class="topo-filtros">
      <div class="filtro-ano">
        <label>Ano de referência</label>
        <select id="filtro-ano" onchange="carregarDados()"></select>
      </div>
      <div class="quadro-info" id="quadro-info"></div>
    </div>

    <div class="alerta" id="alerta-sem-classificacao"></div>

    <div id="conteudo">
      <div class="loading">Carregando indicadores...</div>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwx1dgtUQRwO1nnUFvYg3YumEdWz5ll7f4y1eeogxhogYM0uVGLa5Xzc2ZYcOWIhp2p/exec';
  let usuarioLogado = null;

  // ── LOGIN ─────────────────────────────────────────────────
  async function fazerLogin() {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value.trim();
    if (!user || !pass) return;
    try {
      const r = await fetch(`${SCRIPT_URL}?tipo=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}&cb=${Date.now()}`, { cache: 'no-store' });
      const data = await r.json();
      if (data.ok) {
        usuarioLogado = data.user;
        document.getElementById('login-wrap').style.display = 'none';
        document.getElementById('painel-wrap').style.display = 'block';
        document.getElementById('header-user').textContent = data.user;
        montarSeletorAno();
        carregarDados();
      } else {
        document.getElementById('login-erro').style.display = 'block';
      }
    } catch (e) {
      document.getElementById('login-erro').style.display = 'block';
    }
  }

  function sair() {
    usuarioLogado = null;
    document.getElementById('login-wrap').style.display = 'flex';
    document.getElementById('painel-wrap').style.display = 'none';
    document.getElementById('login-user').value = '';
    document.getElementById('login-pass').value = '';
  }

  function montarSeletorAno() {
    const sel = document.getElementById('filtro-ano');
    const anoAtual = new Date().getFullYear();
    sel.innerHTML = '';
    for (let a = anoAtual; a >= anoAtual - 3; a--) {
      const opt = document.createElement('option');
      opt.value = a;
      opt.textContent = a;
      sel.appendChild(opt);
    }
  }

  // ── DADOS ─────────────────────────────────────────────────
  async function carregarDados() {
    const ano = document.getElementById('filtro-ano').value;
    document.getElementById('conteudo').innerHTML = '<div class="loading">Carregando indicadores...</div>';
    try {
      const r = await fetch(`${SCRIPT_URL}?tipo=painelGestao&ano=${ano}&cb=${Date.now()}`, { cache: 'no-store' });
      const d = await r.json();
      if (d.erro) throw new Error(d.erro);
      renderPainel(d);
    } catch (e) {
      document.getElementById('conteudo').innerHTML = '<div class="loading">Não foi possível carregar os indicadores agora. Tente novamente em alguns instantes.</div>';
    }
  }

  function fmtPct(v) {
    if (v === null || v === undefined || isNaN(v)) return null;
    return v.toFixed(1).replace('.', ',') + '%';
  }

  function statValueHTML(pct) {
    const f = fmtPct(pct);
    if (f === null) return '<div class="stat-value sem-dado">Sem dados</div>';
    return `<div class="stat-value">${f}</div>`;
  }

  function absenteismoCardHTML(d) {
    if (!d.pontoRegistros || d.pontoRegistros === 0) {
      return `
        <div class="card-construcao">
          <div class="icone">🚧</div>
          <div class="titulo">Taxa de Absenteísmo — aguardando dados</div>
          <div class="desc">Nenhum arquivo de ponto processado para ${d.ano} ainda. Envie os espelhos de ponto mensais para o RH processar. Referência de mercado: uma boa taxa é de até 4%.</div>
        </div>`;
    }
    return `
      <div class="stat-card">
        <div class="stat-label">Taxa de Absenteísmo</div>
        ${statValueHTML(d.taxaAbsenteismo)}
        <div class="stat-sub">Cobertura parcial: ${d.pontoColaboradoresCobertos} colaborador(es), competência(s) ${(d.pontoCompetenciasCobertas||[]).join(', ')}</div>
        <div class="stat-extra">Referência de mercado: uma boa taxa é de até 4%</div>
      </div>`;
  }

  function renderPainel(d) {
    // Info do quadro
    document.getElementById('quadro-info').innerHTML =
      `Quadro atual: <b>${d.totalAtual}</b> colaboradores &middot; Início do período: <b>${d.totalInicioPeriodo}</b>`;

    // Alerta de desligamentos sem classificação (só aparece se existir de fato)
    const alerta = document.getElementById('alerta-sem-classificacao');
    if (d.desligamentosSemClassificacao > 0) {
      alerta.classList.add('show');
      alerta.innerHTML = `⚠️ ${d.desligamentosSemClassificacao} desligamento(s) no período sem "Tipo de Desligamento" preenchido na planilha (${(d.nomesSemClassificacao||[]).join(', ')}) — o Turnover Voluntário/Involuntário não considera esses casos. Peça para o RH completar essa coluna.`;
    } else {
      alerta.classList.remove('show');
    }

    const enps = d.enps || { total: 0 };
    const zonaClasse = enps.zona === 'crítica' ? 'badge-critica' : enps.zona === 'excelente' ? 'badge-excelente' : 'badge-positiva';

    document.getElementById('conteudo').innerHTML = `
      <div class="secao-titulo">Turnover &amp; Retenção — ${d.ano}</div>
      <div class="grid-cards">

        <div class="stat-card">
          <div class="stat-label">Turnover Geral</div>
          <div class="card-dupla">
            <div class="dupla-item">
              <span class="dupla-label">Fórmula clássica<br>(admissões + demissões) / 2</span>
              <span class="dupla-valor">${fmtPct(d.turnoverGeralFormulaClassica) || '—'}</span>
            </div>
            <div class="dupla-item">
              <span class="dupla-label">Fórmula simplificada<br>(recomendada p/ empresas até 200 colab.)</span>
              <span class="dupla-valor">${fmtPct(d.turnoverGeralFormulaSimplificada) || '—'}</span>
            </div>
          </div>
          <div class="stat-extra">Referência: ideal ~10% &middot; média das empresas no Brasil ~43%</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Turnover Voluntário</div>
          ${statValueHTML(d.turnoverVoluntario)}
          <div class="stat-sub">${d.desligamentosVoluntarios} pedido(s) de desligamento em ${d.ano}</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Turnover Involuntário</div>
          ${statValueHTML(d.turnoverInvoluntario)}
          <div class="stat-sub">${d.desligamentosInvoluntarios} desligamento(s) por iniciativa da empresa em ${d.ano}</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Taxa de Retenção</div>
          ${statValueHTML(d.taxaRetencao)}
          <div class="stat-sub">${d.totalAtual} colaboradores hoje vs. ${d.totalInicioPeriodo} no início de ${d.ano}</div>
        </div>

      </div>

      <div class="secao-titulo">Satisfação — eNPS</div>
      <div class="grid-cards">
        <div class="enps-card" style="grid-column: 1 / -1;">
          <div class="enps-topo">
            <div>
              <div class="stat-label">eNPS — todas as respostas recebidas</div>
              <div class="enps-score">${enps.score !== null && enps.score !== undefined ? enps.score : '—'}</div>
              <div class="enps-total">${enps.total} resposta(s) recebida(s)</div>
            </div>
            ${enps.zona ? `<span class="badge-zona ${zonaClasse}">Zona ${enps.zona}</span>` : ''}
          </div>
          <div class="enps-breakdown">
            <div class="enps-item promotor"><div class="n">${enps.promotores || 0}</div><div class="l">Promotores (9-10)</div></div>
            <div class="enps-item neutro"><div class="n">${enps.neutros || 0}</div><div class="l">Neutros (7-8)</div></div>
            <div class="enps-item detrator"><div class="n">${enps.detratores || 0}</div><div class="l">Detratores (0-6)</div></div>
          </div>
          <a class="enps-link" href="../enps/index.html" target="_blank">🔗 Abrir link da pesquisa para divulgar à equipe</a>
        </div>
      </div>

      <div class="secao-titulo">Frequência &amp; Pontualidade</div>
      <div class="grid-cards">
        ${absenteismoCardHTML(d)}
        <div class="card-construcao">
          <div class="icone">🚧</div>
          <div class="titulo">Pontualidade Individual da Equipe — em construção</div>
          <div class="desc">Requer o horário de cada batida de ponto por colaborador/dia, não só o resumo do mês. Em avaliação com a Paula a melhor forma de extrair isso do sistema de ponto.</div>
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
